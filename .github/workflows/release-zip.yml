name: release-zip

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - package.json
      - VERSION.txt
      - README.md
      - CHANGELOG.md
      - docs/**
      - src/**
      - test/**
      - bot-integration/**
      - linux/**
      - assets/**
      - INSTALAR.bat
      - INICIAR.bat
      - supabase/**
      - .github/workflows/release-zip.yml

permissions:
  contents: write

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 26
      - run: npm ci --no-audit --no-fund
      - run: npm run check
      - run: npm run check:commands
      - run: timeout 120s npm test

  build-release:
    needs: validate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build versioned ZIP
        id: package
        shell: bash
        run: |
          VERSION="$(node -p "require('./package.json').version")"
          DIRECTORY="ASTHEN-BOT-v${VERSION}"
          ARCHIVE="ASTHEN-BOT-v${VERSION}.zip"
          mkdir -p "$DIRECTORY"
          git archive "${GITHUB_SHA}" | tar -x -C "$DIRECTORY"
          zip -qr "$ARCHIVE" "$DIRECTORY"
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"
          echo "archive=${ARCHIVE}" >> "$GITHUB_OUTPUT"

      - name: Publish versioned GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="v${{ steps.package.outputs.version }}"
          ARCHIVE="${{ steps.package.outputs.archive }}"
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" "$ARCHIVE" --clobber
          else
            gh release create "$TAG" "$ARCHIVE" \
              --target "$GITHUB_SHA" \
              --title "ASTHEN BOT ${{ steps.package.outputs.version }}" \
              --generate-notes
          fi
